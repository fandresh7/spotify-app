<img
  class="h-12 w-12 rounded transition-opacity duration-500 group-hover/song:opacity-80"
  [src]="track().album.images[0].url"
  alt=""
  loading="lazy" />

<div class="flex flex-col gap-0.5 text-left">
  <p class="[display:-webkit-box] [overflow:hidden] font-bold [-webkit-box-orient:vertical] [-webkit-line-clamp:1]">{{ track().name }}</p>
  <p class="[display:-webkit-box] [overflow:hidden] [-webkit-box-orient:vertical] [-webkit-line-clamp:1]">{{ track().artists[0].name }}</p>
</div>

<icon
  (click)="onPlayClick($event)"
  [name]="isPlaying() ? 'pause' : 'play'"
  class="hover:text-spotify-hover ml-auto block cursor-pointer opacity-0 transition-colors duration-500 group-hover/song:opacity-100"
  [class.opacity-100]="isPlaying()"
  [class.text-spotify]="isPlaying()">
</icon>
