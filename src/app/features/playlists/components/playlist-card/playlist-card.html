<img
  class="flex-shrink-0 rounded"
  [width]="48"
  [height]="48"
  [ngSrc]="image().url"
  alt="Playlist image" />

<div class="hidden items-center @xs/playlist-card:flex">
  <p class="[display:-webkit-box] [overflow:hidden] text-xs font-bold text-balance [-webkit-box-orient:vertical] [-webkit-line-clamp:2]">{{ playlist().name }}</p>
</div>
