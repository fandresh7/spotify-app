<section class="flex flex-col gap-6">
  <!-- Header -->
  <header class="flex items-center justify-between">
    <h2 class="text-xl font-bold">{{ title() }}</h2>
    <button
      (click)="close()"
      class="hover:bg-dark-tinted rounded-full p-2 transition-colors duration-200">
      <icon name="x"></icon>
    </button>
  </header>

  <!-- Form -->
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label
        for="playlist-name"
        class="text-sm font-semibold">
        Playlist Name
      </label>
      <input
        id="playlist-name"
        type="text"
        [formControl]="nameControl"
        (keydown.enter)="submit()"
        placeholder="Enter playlist name"
        class="bg-dark-elevated-base placeholder:text-gray-dark border-gray-darker focus:border-spotify rounded-md border px-4 py-3 text-white transition-colors duration-200 outline-none" />
      @if (nameControl.touched && nameControl.invalid) {
      <span class="text-error text-xs"> @if (nameControl.hasError('required')) { Playlist name is required } @if (nameControl.hasError('maxlength')) { Playlist name is too long (max 100 characters) } </span>
      }
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3">
      <button
        type="button"
        (click)="close()"
        class="hover:bg-dark-tinted rounded-full px-6 py-3 font-semibold transition-colors duration-200">
        Cancel
      </button>
      <button
        type="button"
        (click)="submit()"
        [disabled]="nameControl.invalid"
        class="bg-spotify text-dark hover:bg-spotify-hover disabled:bg-gray-dark disabled:text-gray-darker rounded-full px-6 py-3 font-semibold transition-colors duration-200 disabled:cursor-not-allowed">
        {{ submitButtonText() }}
      </button>
    </div>
  </div>
</section>
