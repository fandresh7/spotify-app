<section class="grid h-full grid-cols-[100px_1fr] gap-4 sm:grid-cols-[250px_1fr]">
  <aside class="bg-dark-base min-h-0 overflow-y-auto rounded-lg p-4 pr-2">
    <section class="flex flex-col gap-2">
      @for (playlist of playlists(); track playlist.id) {
      <playlist-card
        [playlist]="playlist"
        (clicked)="onPlaylistSelected($event)">
      </playlist-card>
      }
    </section>
  </aside>

  <section
    class="grid min-h-0 grid-cols-2 overflow-y-hidden rounded-lg p-4"
    style="background: var(--gradient-primary)">
    <playlist />
  </section>
</section>
